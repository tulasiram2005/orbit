services:
  - type: web
    name: orbit-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_URL
        value: https://orbit-api-i42f.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://orbit-api-i42f.onrender.com
  - type: web
    name: orbit-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: API_CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ORBIT_ALLOW_PRODUCTION_SEED
        value: "false"
      - key: ORBIT_PRODUCTION_SEED_PASSWORD
        sync: false

databases:
  - name: orbit-db
    plan: free
